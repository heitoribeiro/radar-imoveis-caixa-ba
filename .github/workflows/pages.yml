name: Atualizar CAIXA e publicar Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '*.tmp'
      - 'scripts/*.tmp'
      - 'scripts/send_email_alerts.py'
      - 'config/email-alerts.json'
  workflow_dispatch:
  schedule:
    # 09:05 UTC = 06:05 em Brasília
    - cron: '5 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Atualizar listas nacionais da CAIXA
        run: python scripts/update_caixa.py

      - name: Salvar histórico de primeira detecção
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/first-seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/first-seen.json
            git commit -m "dados: atualizar histórico nacional de imóveis CAIXA"
            git push
          else
            echo "Sem mudanças no histórico."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        run: |
          mkdir -p _site/data
          cp index.html styles.css enhancements.css app-v4.js app-core.js sw.js manifest.webmanifest _site/
          cp -r icons _site/
          cp .generated-data/imoveis-brasil.json _site/data/
          touch _site/.nojekyll

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
