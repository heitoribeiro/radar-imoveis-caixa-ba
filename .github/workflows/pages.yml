name: Atualizar CAIXA e publicar Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '*.tmp'
      - 'scripts/*.tmp'
      - 'scripts/send_email_alerts.py'
      - 'config/email-alerts.json'
  workflow_dispatch:
  schedule:
    # 09:05 UTC = 06:05 em Brasília
    - cron: '5 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Atualizar listas nacionais da CAIXA
        if: github.event_name != 'push'
        run: python scripts/update_caixa.py

      - name: Reutilizar última base publicada no deploy visual
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p .generated-data
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://betelradar.com.br/data/imoveis-brasil.json' \
            -o .generated-data/imoveis-brasil.json
          python - <<'PY'
          import json
          p='.generated-data/imoveis-brasil.json'
          with open(p, encoding='utf-8') as f:
              data=json.load(f)
          assert isinstance(data.get('properties'), list) and data['properties'], 'Base publicada inválida'
          print(f"Base atual reutilizada: {len(data['properties'])} imóveis")
          PY

      - name: Salvar histórico de primeira detecção
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/first-seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
            git add data/first-seen.json
            git commit -m "dados: atualizar histórico nacional de imóveis CAIXA"
            git push
          else
            echo "Sem mudanças no histórico."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        run: |
          mkdir -p _site/data
          cp index.html alert-status.html styles.css enhancements.css app-v4.js app-core.js sw.js manifest.webmanifest _site/
          cp -r icons _site/
          cp .generated-data/imoveis-brasil.json _site/data/
          touch _site/.nojekyll

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
